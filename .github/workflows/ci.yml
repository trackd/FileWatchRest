name: CI

on:
  push:
    branches: [ main, "feature/**", "dev" ]
    tags: ['v*']
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run release orchestration
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/release.ps1 -PublishToGitHub

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/**
          retention-days: 30

      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: codecov-filewatchrest
          fail_ci_if_error: false

  sync-release-version:
    name: Sync release version to main
    runs-on: windows-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync csproj version from tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/bump-version.ps1 $version

          git config user.name 'trackd'
          git config user.email '17672644+trackd@users.noreply.github.com'

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Project version already matches $version"
            exit 0
          }

          git commit --amend --no-edit --no-verify
          git push --force-with-lease origin HEAD:main

  create-release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: [build-and-test, sync-release-version]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FileWatchRest ${{ github.ref_name }}
          body_path: ./artifacts/release_notes.md
          files: |
            ./artifacts/FileWatchRest-*.msi
            ./artifacts/FileWatchRest-*.zip
